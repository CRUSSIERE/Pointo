services:
  - type: web
    name: pointo
    runtime: static
    # le déploiement échoue (et l'ancienne version reste en ligne) si les tests de calcul cassent
    buildCommand: npm test
    staticPublishPath: .
    # attend que les tests GitHub (calculs + navigateur) soient verts avant de déployer
    autoDeployTrigger: checksPass
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
